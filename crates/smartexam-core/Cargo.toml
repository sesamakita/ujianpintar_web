[package]
name = "smartexam-core"
version = "0.1.0"
edition = "2021"
authors = ["SmartExam Team"]
description = "High-performance Exam Engine, Anti-Cheat Verification, and Auto-Grading Core in Rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
